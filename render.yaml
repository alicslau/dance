# Render Blueprint：一键部署后端（Web Service）
# 用法：把仓库推到 GitHub 后，在 Render 里 New → Blueprint 选本仓库。
services:
  - type: web
    name: dance-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
